[package]
name = "clipasm-playground"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clipasm = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.126"

[lints]
workspace = true
