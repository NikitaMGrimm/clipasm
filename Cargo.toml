[package]
name = "clipasm"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
description = "A strict, typed language for compiling and rendering Video and Audio graphs"
license = "MIT"
repository = "https://github.com/NikitaMGrimm/clipasm"
homepage = "https://nikitamgrimm.github.io/clipasm/"
documentation = "https://docs.rs/clipasm"
readme = "README.md"
keywords = ["video-editing", "audio", "ffmpeg", "compiler", "dsl"]
categories = ["command-line-utilities", "multimedia::video"]
include = [
    "/book.toml",
    "/docs/**",
    "/src/**",
    "/tests/**",
    "/examples/?*.clipasm",
    "/examples/programs/**/*.clipasm",
    "/examples/programs/**/*.py",
    "/examples/starter/**",
    "/examples/assets/gentle-motion.mkv",
    "/examples/assets/*.png",
    "/theme/**",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[workspace]
members = ["playground", "tools/reference-docs"]
default-members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lib]
name = "clipasm"
path = "src/lib.rs"

[[bin]]
name = "clipasm"
path = "src/main.rs"

[[test]]
name = "documented_cli"
path = "tests/documented_cli.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(windows)'.dependencies]
command-group = "5.0.1"

[dev-dependencies]
trycmd = { version = "1.2.1", default-features = false, features = ["diff"] }

[lints]
workspace = true
