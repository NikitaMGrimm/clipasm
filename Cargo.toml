[package]
name = "clipasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A strict, typed, stack-based programmatic video compiler"
license = "MIT"
repository = "https://github.com/NikitaMGrimm/clipasm"
homepage = "https://nikitamgrimm.github.io/clipasm/"
documentation = "https://docs.rs/clipasm"
readme = "README.md"
keywords = ["video-editing", "audio", "ffmpeg", "compiler", "dsl"]
categories = ["command-line-utilities", "multimedia::video"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/assets/gentle-motion.mkv",
    "/examples/assets/morning.png",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[lib]
name = "clipasm"
path = "src/lib.rs"

[[bin]]
name = "clipasm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"


[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
