[book]
title = "ClipAsm"
description = "Learn, use, and contribute to ClipAsm"
authors = ["ClipAsm contributors"]
language = "en"
src = "docs"

[rust]
edition = "2024"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
additional-css = ["theme/clipasm-playground.css"]
additional-js = ["theme/clipasm-playground.js"]

[output.html.playground]
runnable = false

[output.html.fold]
enable = true
level = 1
