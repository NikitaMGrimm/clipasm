name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install verification tools
        run: |
          cargo install mdbook --version 0.5.4 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify tag version
        run: python scripts/package_release.py verify --tag "$GITHUB_REF_NAME"
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Check dependency policy
        run: cargo deny --all-features check
      - name: Verify publish package
        run: cargo publish --dry-run --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/clipasm
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/clipasm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/clipasm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release binary
        run: >-
          python scripts/package_release.py package
          --tag "${{ github.ref_name }}"
          --target "${{ matrix.target }}"
          --binary "${{ matrix.binary }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
