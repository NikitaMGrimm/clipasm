name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install verification tools
        run: |
          cargo install mdbook --version 0.5.4 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify tag version
        run: python scripts/package_release.py verify --tag "$GITHUB_REF_NAME"
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Check dependency policy
        run: cargo deny --all-features check
      - name: Verify publish package
        run: cargo publish --dry-run --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/clipasm
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/clipasm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/clipasm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maximumWaitSeconds = 30 * 60
          $waitedSeconds = 0
          $delaySeconds = 1
          $attempt = 1

          while ($true) {
            choco install ffmpeg --no-progress --yes
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              break
            }

            if ($waitedSeconds + $delaySeconds -gt $maximumWaitSeconds) {
              Write-Host "::error::Chocolatey failed after $attempt attempts and $waitedSeconds seconds of backoff."
              exit $exitCode
            }

            Write-Host "Chocolatey attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
            $waitedSeconds += $delaySeconds
            $delaySeconds *= 2
            $attempt += 1
          }
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Run portable tests
        run: >-
          cargo test --locked
          --lib
          --test authored_programs
          --test cli
          --test compiler_contract
          --test external_programs
          --test preflight_contract
          --test render
          --test semantics
          --test transitions
      - name: Run doctests
        run: cargo test --locked --doc
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release binary
        run: >-
          python scripts/package_release.py package
          --tag "${{ github.ref_name }}"
          --target "${{ matrix.target }}"
          --binary "${{ matrix.binary }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Check published crate
        id: crate
        run: |
          cargo package --locked
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          package = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]
          name = package["name"]
          version = package["version"]
          archive = Path("target/package") / f"{name}-{version}.crate"
          request = Request(
              f"https://crates.io/api/v1/crates/{name}/{version}",
              headers={"User-Agent": "clipasm release workflow"},
          )
          try:
              with urlopen(request) as response:
                  remote = json.load(response)["version"]["checksum"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          else:
              local = hashlib.sha256(archive.read_bytes()).hexdigest()
              if local != remote:
                  raise SystemExit(
                      f"{name} {version} is already published with different contents"
                  )
              published = True
              print(f"{name} {version} is already published with matching contents")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"published={str(published).lower()}", file=output)
          PY
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.crate.outputs.published != 'true'
        id: auth
      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: [build, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
