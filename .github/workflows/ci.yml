name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency policy
        run: cargo deny --all-features check
      - name: Verify publish package
        run: cargo publish --dry-run --locked

  rust-api-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: 1.95.0

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: ./scripts/check.sh

  browser-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd1 # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playground/web/package-lock.json
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
      - name: Install WebAssembly bindings
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Build browser playground
        run: mdbook build && ./scripts/build_playground.sh
      - name: Check browser JavaScript
        run: >-
          node --check theme/clipasm-playground.js &&
          node --check playground/web/clipasm-playground-worker.js &&
          node --check playground/web/clipasm-playground-render-worker.js &&
          node --check playground/web/browser-smoke.mjs
      - name: Render in Chrome
        run: npm --prefix playground/web run test:browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

  portable-rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run portable tests
        run: >-
          cargo test
          --lib
          --test authored_programs
          --test cli
          --test compiler_contract
          --test external_programs
          --test preflight_contract
          --test render
          --test semantics
          --test transitions
      - name: Run doctests
        run: cargo test --doc
