name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency policy
        run: cargo deny --all-features check
      - name: Verify publish package
        run: cargo publish --dry-run --locked

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: ./scripts/check.sh

  portable-rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run portable tests
        run: >-
          cargo test
          --lib
          --test authored_programs
          --test cli
          --test compiler_contract
          --test external_programs
          --test render
          --test semantics
          --test transitions
      - name: Run doctests
        run: cargo test --doc
