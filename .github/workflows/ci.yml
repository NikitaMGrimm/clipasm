name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: ./scripts/check.sh

  portable-rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run portable tests
        run: >-
          cargo test
          --lib
          --test authored_programs
          --test cli
          --test compiler_contract
          --test external_programs
          --test render
          --test semantics
          --test transitions
      - name: Run doctests
        run: cargo test --doc
